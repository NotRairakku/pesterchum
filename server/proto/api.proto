syntax = "proto3";

package proto;

option go_package = "/proto;proto";

service ChatService {
  rpc Register (RegisterRequest) returns (Empty);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Logout (Empty) returns (Empty);
  rpc Validate (Empty) returns (Empty);

  rpc GetUserData (Empty) returns (GetUserDataResponse);
  rpc GetUserFriends (Empty) returns (GetUserFriendsResponse);
  rpc GetFriendsRequests (Empty) returns (GetFriendsRequestsList);

  rpc UpdateUsername (UpdateUsernameRequest) returns (Empty);
  rpc UpdatePassword (UpdatePasswordRequest) returns (Empty);
  rpc UpdatePhoto (UpdatePhotoRequest) returns (Empty);
  rpc UpdateDescription (UpdateDescriptionRequest) returns (Empty);
  rpc UpdateMood (UpdateMoodRequest) returns (Empty);
  rpc UpdateColor (UpdateColorRequest) returns (Empty);
  rpc UpdateBirthdate (UpdateBirthdateRequest) returns (Empty);
  rpc UpdateAddress (UpdateAddressRequest) returns (Empty);

  rpc CreateRequestFriendship (CreateRequestFriendshipRequest) returns (Empty);
  rpc AnswerRequestFriendship (AnswerRequestFriendshipRequest) returns (Empty);

  rpc GetChatHistory (GetChatHistoryRequest) returns (GetChatHistoryResponse);
  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc SubscribeChat (SubscribeChatRequest) returns (stream ChatEvent);

  rpc GetPublicUserData(GetPublicUserDataRequest) returns (GetPublicUserDataResponse);
}

message GetUserDataResponse {
  string user_id = 1;
  string username = 2;
  string photo = 3;
  string description = 4;
  string mood = 5;
  string color = 6;
  string birthdate = 7;
  string address = 8;
}

message GetUserFriendsResponse {
  repeated Friend friends = 1;
}

message Friend {
  string friend_id = 1;
  string friend_name = 2;
  string friend_mood = 3;
}

message GetFriendsRequestsResponse {
  string user_id = 1;
  string user_name = 2;
}

message GetFriendsRequestsList {
  repeated GetFriendsRequestsResponse requests = 1;
}

message FriendRequest {
  string user_id = 1;
  string user_name = 2;
}

message GetChatHistoryRequest {
  string friend_id = 1;
  int32 limit = 2;          // 20–100
  string before_msg_id = 3; // для пагинации вверх
}

message GetChatHistoryResponse {
  repeated ChatMessage messages = 1;
}

message SendMessageRequest {
  string recipient_id = 1;
  string text = 2;
}

message SendMessageResponse {
  string message_id = 1;
  string created_at = 2;     // RFC3339
}

message SubscribeChatRequest {
  string friend_id = 1;
}

message ChatEvent {
  oneof event {
    ChatMessage message = 1;
    TypingEvent typing = 2;
    ReadEvent read = 3;
  }
}

message ChatMessage {
  string message_id = 1;
  string sender_id = 2;
  string recipient_id = 3;
  string text = 4;
  string created_at = 5;      // RFC3339
}

message TypingEvent {
  string user_id = 1;
  bool is_typing = 2;
}

message ReadEvent {
  string user_id = 1;
  string up_to_message_id = 2;
}

message GetPublicUserDataRequest {
  string user_id = 1;
}

message GetPublicUserDataResponse {
  string username = 1;
  string color = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string session_id = 1;
}

message CreateRequestFriendshipRequest {
  string request_friend_name = 1;
}

message AnswerRequestFriendshipRequest {
  string user_id = 1;
  bool accept = 2;
}

message UpdateUsernameRequest {
  string new_username = 1;
}

message UpdatePasswordRequest {
  string new_password = 1;
}

message UpdatePhotoRequest {
  string new_photo = 1;
}

message UpdateDescriptionRequest {
  string new_description = 1;
}

message UpdateMoodRequest {
  string new_mood = 1;
}

message UpdateColorRequest {
  string new_color = 1;
}

message UpdateBirthdateRequest {
  string new_birthdate = 1;
}

message UpdateAddressRequest {
  string new_address = 1;
}

message Empty {}
