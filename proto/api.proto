syntax = "proto3";

package api;

option go_package = "server/proto;proto";

service ChatService {
  rpc Register (RegisterRequest) returns (Empty);
  rpc Login (LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string session_id = 1;
}

message Empty {}
